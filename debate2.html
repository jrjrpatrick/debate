	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;

					buffer.put(data.mode, 4);

		this.makeImpl(false, this.getBestMaskPattern() );

	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

/* ───────── 저장소 어댑터 ───────── */
const INC = n => ({__op:'inc', n});
const UNION = (...v) => ({__op:'union', v});
let store;

function makeMock(){
  // 같은 브라우저의 여러 탭이 localStorage로 주고받는다(체험·시험용)
  const K = 'tg_mock_v1';
  const subs = [];
  let MEM = {};
  const load = () => { try{ return JSON.parse(localStorage.getItem(K)) || {}; }catch(e){ return JSON.parse(JSON.stringify(MEM)); } };
  const save = db => { try{ localStorage.setItem(K, JSON.stringify(db)); }catch(e){ MEM = db; } fire(); };
  const fire = () => { const db = load(); subs.forEach(s => s(db)); };
  try{ window.addEventListener('storage', e => { if(e.key === K) fire(); }); }catch(e){}
  const apply = (obj, patch) => {
    for(const [path, val] of Object.entries(patch)){
      const ks = path.split('.'); let o = obj;
      for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]] !== 'object' || !o[ks[i]]) o[ks[i]] = {}; o = o[ks[i]]; }
      const last = ks[ks.length-1];
      if(val && val.__op === 'inc') o[last] = (o[last]||0) + val.n;
      else if(val && val.__op === 'union'){ const a = Array.isArray(o[last]) ? o[last] : []; val.v.forEach(x => { if(!a.includes(x)) a.push(x); }); o[last] = a; }
      else if(val && val.__op === 'del') delete o[last];
      else o[last] = val;
    }
  };
  let uid = null; try{ uid = sessionStorage.getItem('tg_mock_uid'); }catch(e){}
  if(!uid){ uid = 'u' + Math.random().toString(36).slice(2,10); try{ sessionStorage.setItem('tg_mock_uid', uid); }catch(e){} }
  return {
    mock:true,
    async init(){ return uid; },
    async getRoom(c){ return load().rooms?.[c]?.doc || null; },
    async createRoom(c, data){ const db = load(); db.rooms = db.rooms || {}; db.rooms[c] = {doc:data, players:{}, votes:{}}; save(db); },
    async updateRoom(c, patch){ const db = load(); if(!db.rooms?.[c]) return; apply(db.rooms[c].doc, patch); save(db); },
    async deleteRoom(c){ const db = load(); if(db.rooms) delete db.rooms[c]; save(db); },
    async setPlayer(c, id, data){ const db = load(); if(!db.rooms?.[c]) throw new Error('no room'); db.rooms[c].players[id] = data; save(db); },
    async updatePlayer(c, id, patch){ const db = load(); const p = db.rooms?.[c]?.players?.[id]; if(!p) return; apply(p, patch); save(db); },
    async deletePlayer(c, id){ const db = load(); if(db.rooms?.[c]) delete db.rooms[c].players[id]; save(db); },
    async getPlayers(c){ return load().rooms?.[c]?.players || {}; },
    async setVote(c, id, data){ const db = load(); if(!db.rooms?.[c]) return; if(db.rooms[c].votes[id]) throw new Error('voted'); db.rooms[c].votes[id] = data; save(db); },
    watch(c, cb){ const f = db => { const r = db.rooms?.[c]; cb(r ? r.doc : null, r ? r.players : {}, r ? r.votes : {}); }; subs.push(f); f(load()); return () => subs.splice(subs.indexOf(f), 1); }
  };
}

async function makeFirebase(cfg){
  // Firebase 실시간 데이터베이스(Realtime Database) — 바뀐 부분만 오가서 무료 한도 안에서 넉넉함
  const V = '10.12.2';
  const {initializeApp} = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const {getAuth, signInAnonymously, onAuthStateChanged} = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const D = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
  const app = initializeApp(cfg, 'toron-gwangjang');
  const auth = getAuth(app); const db = D.getDatabase(app);
  const conv = patch => { const o = {}; for(const [k,v] of Object.entries(patch)){ const path = k.split('.').join('/');
      if(v && v.__op === 'inc') o[path] = D.increment(v.n);
      else if(v && v.__op === 'union') v.v.forEach(x => o[path + '/' + x] = true);
      else if(v && v.__op === 'del') o[path] = null;
      else o[path] = v === undefined ? null : v; } return o; };
  const norm = p => { if(!p) return p; const q = {...p}; ['liked','read'].forEach(k => { if(q[k] && !Array.isArray(q[k])) q[k] = Object.keys(q[k]); }); return q; };
  const toObj = (arr) => { const o = {}; (arr||[]).forEach(x => o[x] = true); return o; };
  const base = c => `tg/${c}`;
  return {
    mock:false,
    async init(){ await signInAnonymously(auth); return new Promise(res => onAuthStateChanged(auth, u => u && res(u.uid))); },
    async getRoom(c){ const s = await D.get(D.ref(db, base(c) + '/doc')); return s.exists() ? s.val() : null; },
    async createRoom(c, data){ await D.set(D.ref(db, base(c) + '/doc'), data); },
    async updateRoom(c, patch){ await D.update(D.ref(db, base(c) + '/doc'), conv(patch)); },
    async deleteRoom(c){ await D.remove(D.ref(db, base(c))); },
    async setPlayer(c, id, data){ const d = {...data, liked: toObj(data.liked), read: toObj(data.read)}; Object.keys(d).forEach(k => d[k] === undefined && delete d[k]); await D.set(D.ref(db, `${base(c)}/players/${id}`), d); },
    async updatePlayer(c, id, patch){ await D.update(D.ref(db, `${base(c)}/players/${id}`), conv(patch)); },
    async deletePlayer(c, id){ await D.remove(D.ref(db, `${base(c)}/players/${id}`)); },
    async getPlayers(c){ const s = await D.get(D.ref(db, base(c) + '/players')); const o = s.val() || {}; Object.keys(o).forEach(k => o[k] = norm(o[k])); return o; },
    async setVote(c, id, data){ await D.set(D.ref(db, `${base(c)}/votes/${id}`), data); },
    watch(c, cb){
      let room = null, players = {}, votes = {}; const got = {r:0, p:0, v:0};
      const go = () => { if(got.r && got.p && got.v) cb(room, players, votes); };
      const u1 = D.onValue(D.ref(db, base(c) + '/doc'), s => { room = s.val(); got.r = 1; go(); });
      const u2 = D.onValue(D.ref(db, base(c) + '/players'), s => { const o = s.val() || {}; Object.keys(o).forEach(k => o[k] = norm(o[k])); players = o; got.p = 1; go(); });
      const u3 = D.onValue(D.ref(db, base(c) + '/votes'), s => { votes = s.val() || {}; got.v = 1; go(); });
      return () => { u1(); u2(); u3(); };
    }
  };
}

/* ───────── 입장 방식: 양자택일(two) · 삼자/사자택일(multi) · 가치 수직선(scale) ───────── */
const MODE = (room) => ((room || R) && (room || R).mode) || 'two';
const sideKeys = (room) => { room = room || R; return MODE(room) === 'multi' ? (room.sides || []).map(s => s.k) : ['A','B']; };
const sideObj = (t, room) => ((room || R).sides || []).find(s => s.k === t);
const SC = (room) => (room || R).scale || {max:10, left:'', right:'', statement:'', claim:''};
function sideName(t){
  if(!t) return '아직 고르지 않음';
  if(MODE() === 'scale') return t === 'A' ? (SC().left || '왼쪽') + ' 쪽' : t === 'B' ? (SC().right || '오른쪽') + ' 쪽' : '가운데';
  const s = sideObj(t); if(s) return s.label;
  return t === 'A' ? (R.sideA || 'A') : t === 'B' ? (R.sideB || 'B') : '아직 고르지 않음';
}
// 양자택일은 입장 이름으로 주장 문장을 저절로 만든다: '보존해야 한다' → '나는 보존해야 한다고 생각한다.'
function defaultClaim(label){ const l = String(label || '').trim().replace(/[.。]+$/, ''); if(!l) return ''; return /다$/.test(l) ? `나는 ${l}고 생각한다.` : `나는 ‘${l}’ 입장이다.`; }
function claimFor(p, room){
  room = room || R; if(!p) return '';
  if(MODE(room) === 'scale'){ if(p.score == null) return ''; const sc = SC(room);
    return String(sc.claim || '나는 ‘{진술}’에 대해 {최대}점 중 {점수}점의 입장이다.').replace(/\{점수\}/g, p.score).replace(/\{최대\}/g, sc.max).replace(/\{진술\}/g, sc.statement || ''); }
  const s = sideObj(p.team, room); if(s && s.claim) return s.claim;
  return p.team ? defaultClaim(p.team === 'A' ? room.sideA : p.team === 'B' ? room.sideB : '') : '';
}
// 수직선: 점수 ↔ 광장 가로 위치
const scoreX = (s, room) => 6 + (s / SC(room).max) * 88;
const xScore = (x, room) => Math.max(0, Math.min(SC(room).max, Math.round((x - 6) / 88 * SC(room).max)));
const scoreTeam = (s, room) => { const mid = SC(room).max / 2; return s < mid ? 'A' : s > mid ? 'B' : 'M'; };
// 삼자·사자택일: 광장을 세로 칸으로 나눈다
function zoneOf(x, room){ const ks = sideKeys(room), w = 100 / ks.length; return ks[Math.min(ks.length - 1, Math.max(0, Math.floor(x / w)))]; }
function zoneRange(k, room){ const ks = sideKeys(room), i = ks.indexOf(k), w = 100 / ks.length; return [i * w, (i + 1) * w]; }
function posX(team, room){
  if(MODE(room) === 'multi' && team){ const [a, b] = zoneRange(team, room); return Math.round(a + 4 + Math.random() * Math.max(1, b - a - 8)); }
  return team === 'A' ? Math.round(8 + Math.random()*36) : team === 'B' ? Math.round(56 + Math.random()*36) : Math.round(42 + Math.random()*16);
}

/* ───────── 의견 쓰기 설정 (교사가 방을 만들 때 정함) ───────── */
const ARG0 = {ev:false, cr:false, nR:1, nE:1, how:'free', reasons:[], evidences:[], qs:[], qAll:true, ladder:2};
const AC = () => ({...ARG0, ...((R && R.arg) || {})});
const HOWS = ['free', 'pick', 'ask'];
const ePickOn = (a = AC()) => a.how !== 'free' && arr(a.evidences).length > 0;   // 증거를 목록에서 고르는가
function seedShuffle(list, seed){   // 학생마다 다르지만, 같은 학생에게는 늘 같은 순서
  let h = 2166136261; for(const ch of String(seed)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const out = list.slice(); for(let i = out.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; } return out;
}
const qSeed = id => String(ROOM) + ':' + id;
// 생각을 여는 질문은 모든 입장에 공통 (id를 주면 그 학생만의 무작위 순서). team 인자는 예전 호출과 맞추려고 남겨 둠
const myQs = (team, id) => { const l = arr(AC().qs).map((q, i) => ({...q, i})).filter(q => q && q.q); return id ? seedShuffle(l, qSeed(id)) : l; };
const qaList = (arg, team, id) => myQs(team, id).map(q => ({q:q.q, i:q.i, a:String(arr(arg && arg.qa)[q.i] || '').trim()})).filter(x => x.a);
const arr = v => Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.keys(v).sort((a,b) => a - b).map(k => v[k]) : []);
const cleanEnd = s => String(s || '').replace(/\s+/g, ' ').trim().replace(/[.。!?]+$/, '').trim();
const cleanReason = s => cleanEnd(s).replace(/^(그 이유는|또 다른 이유는|왜냐하면)\s*/, '').replace(/\s*(때문이다|때문입니다|때문)$/, '').trim();
const cleanQuote = s => cleanEnd(s).replace(/^["“”'‘’]+|["“”'‘’]+$/g, '').replace(/라는 기록.*$/, '').trim();
const cleanFact = s => cleanEnd(s).replace(/^(또한 이는|이는)\s*/, '').replace(/는 사실을 통해.*$/, '').trim();
// 논증 조각들 → 문장들 (k: claim·reason·evid·counter·rebut)
function composeParts(arg, p, room){
  const out = [], cl = claimFor(p, room); if(cl) out.push({k:'claim', t:cl});
  const reasons = arr(arg && arg.reasons), evid = arr(arg && arg.evid);
  reasons.forEach((r, i) => { const b = cleanReason(r && r.body); if(!b) return;
    out.push({k:'reason', t:`${i ? '또 다른 이유는' : '그 이유는'} ${b} 때문이다.`});
    arr(evid[i]).forEach((e, j) => { if(!e || !e.body) return;
      const head = j ? '또한 이는' : '이는', tail = j ? '통해서도' : '통해';
      out.push(e.type === 'record' ? {k:'evid', t:`${head} “${cleanQuote(e.body)}”라는 기록을 ${tail} 알 수 있다.`} : {k:'evid', t:`${head} ${cleanFact(e.body)}는 사실을 ${tail} 알 수 있다.`}); }); });
  const c = arg && arg.counter, rb = arg && arg.rebut;
  if(c && c.a){ const a = cleanEnd(c.a).replace(/^물론\s*/, '').replace(/(라고|고)\s*생각하는 사람도.*$/, '');
    out.push({k:'counter', t:`물론 ${a}${/다$/.test(a) ? '고' : '라고'} 생각하는 사람도 있을 것이다.` + (c.b ? ` 왜냐하면 ${cleanReason(c.b)} 때문이다.` : '')}); }
  if(rb && rb.a){ const a = cleanEnd(rb.a).replace(/^하지만\s*/, '');
    out.push({k:'rebut', t: rb.type === 2 ? `그 말에도 일리가 있다. 하지만 ${josa(a.replace(/(이|가)\s*더 중요하다$/, ''), '이', '가')} 더 중요하다.` + (rb.b ? ` 왜냐하면 ${cleanReason(rb.b)} 때문이다.` : '')
      : `하지만 그 생각은 ${a.replace(/(는)?\s*점에서.*$/, '')}${/다$/.test(a) ? '는' : ''} 점에서 옳지 않다.` + (rb.b ? ` 왜냐하면 ${cleanReason(rb.b)} 때문이다.` : '')}); }
  return out;
}
const composeText = (arg, p, room) => composeParts(arg, p, room).map(x => x.t).join(' ');
const srcList = arg => { const o = []; arr(arg && arg.evid).forEach(g => arr(g).forEach(e => { if(e && e.body && e.src) o.push(e.src); })); return o; };

/* ───────── 점수 계산 (저장하지 않고 언제나 데이터에서 다시 셈) ───────── */
function voteList(){ return Object.values(V || {}); }
function calc(){
  const ps = players(), ind = {}, team = {}; sideKeys().forEach(k => team[k] = 0);
  ps.forEach(p => ind[p.id] = (p.likes||0)*PT.got + (p.liked||[]).length*PT.give + (p.readAll ? PT.readAll : 0));
  ps.forEach(p => { const t = p.readTeam || p.team; if(p.readAll && t && team[t] != null) team[t] += PT.readAllTeam; });
  voteList().forEach(v => { const m = (R.matches||[])[v.mi]; if(!m) return;
    if(m.multi){ const tgt = (m.ids||{})[v.pick]; if(tgt && ind[tgt] != null) ind[tgt] += (v.team === v.pick ? PT.voteSame : PT.voteOpp); return; }
    const target = v.pick === 'a' ? m.a : m.b; const tTeam = v.pick === 'a' ? 'A' : 'B';
    if(ind[target] != null) ind[target] += (v.team === tTeam ? PT.voteSame : PT.voteOpp); });
  Object.entries(R.res || {}).forEach(([mi, r]) => { if(r && team[r.winner] != null){ const m = (R.matches||[])[mi]; team[r.winner] += (m && m.final) ? PT.finalWin : PT.win; } });
  const crossed = [];
  if(R.r3start){ ps.forEach(p => { const was = R.r3start[p.id];
    if(MODE() === 'scale'){ const s0 = (R.r3score || {})[p.id];
      if(s0 != null && p.score != null && p.score !== s0){ crossed.push(p); ind[p.id] = (ind[p.id]||0) + Math.abs(p.score - s0) * PT.movePt; }
      if(was && p.team && p.team !== was && team[p.team] != null){ ind[p.id] += PT.cross; team[p.team] += PT.crossTeam; }
      return; }
    if(was && p.team && p.team !== was){ crossed.push(p); ind[p.id] = (ind[p.id]||0) + PT.cross; if(team[p.team] != null) team[p.team] += PT.crossTeam; } }); }
  return {ind, team, crossed};
}

function readCF(){

  if($('cSplit')) CF.split = v('cSplit');
  if($('cA')){ CF.sideA = v('cA').trim(); CF.sideB = v('cB').trim(); }
  document.querySelectorAll('.mlab').forEach(el => CF.multi[+el.dataset.i].label = el.value.trim());
  document.querySelectorAll('.mcl').forEach(el => CF.multi[+el.dataset.i].claim = el.value.trim());
  if($('sSt')) CF.scale = {statement:v('sSt').trim(), left:v('sL').trim(), right:v('sR').trim(), max:+v('sMax'), claim:v('sCl').trim()};
  if($('aEv')){ const a = CF.arg; a.ev = $('aEv').checked; a.cr = $('aCr').checked; a.nR = +v('aNR'); a.nE = +v('aNE'); a.ladder = +v('aLd');
    const h = document.querySelector('input[name="aHow"]:checked'); a.how = h && HOWS.includes(h.value) ? h.value : 'free';
    if(!Array.isArray(a.qs)) a.qs = []; if(a.qAll == null) a.qAll = true;
    const qa = document.querySelector('input[name="qAll"]:checked'); if(qa) a.qAll = qa.value === '1';
    if($('qList')) a.qs = [...document.querySelectorAll('#qList .lrow')].map(r => ({q:r.querySelector('.qTx').value.trim()}));
    if($('rList')) a.reasons = [...document.querySelectorAll('#rList .lrow')].map(r => ({text:r.querySelector('.rTx').value.trim(), side:r.querySelector('.rSd').value}));
    if($('eList')) a.evidences = [...document.querySelectorAll('#eList .lrow')].map(r => ({type:r.querySelector('.eTy').value, text:r.querySelector('.eTx').value.trim(), src:r.querySelector('.eSr').value.trim(), side:r.querySelector('.eSd').value})); }
}
async function openRoom(){
  const c = CF;
  if(!c.topic) return toast('논제를 써 주세요');
  let mode = 'two', sides = [], scale = null, sideA = '', sideB = '';
  if(c.form === 'two'){
    if(!c.sideA || !c.sideB) return toast('양쪽 입장을 써 주세요');
    sideA = c.sideA; sideB = c.sideB; sides = [{k:'A', label:sideA, claim:defaultClaim(sideA)}, {k:'B', label:sideB, claim:defaultClaim(sideB)}];
  } else if(N_OF[c.form]){
    mode = 'multi'; const n = N_OF[c.form];
    for(let i = 0; i < n; i++){ const m = c.multi[i]; if(!m.label) return toast(`${'가나다라'[i]} 입장 이름을 써 주세요`); if(!m.claim) return toast(`${'가나다라'[i]} 입장의 주장 문장을 써 주세요`);
      sides.push({k:'ABCD'[i], label:m.label, claim:m.claim}); }
    sideA = sides[0].label; sideB = sides[1].label;
  } else {
    mode = 'scale'; scale = {...c.scale};
    if(!scale.statement) return toast('수직선의 진술을 써 주세요'); if(!scale.left || !scale.right) return toast('수직선 양 끝 문구를 써 주세요');
    if(!/\{점수\}/.test(scale.claim)) return toast('주장 문장 틀에 {점수}를 넣어 주세요');
    sideA = scale.left + ' 쪽'; sideB = scale.right + ' 쪽';
  }
  const a = c.arg;
  const how = HOWS.includes(a.how) ? a.how : 'free';
  const arg = {ev:!!a.ev, cr:!!a.cr, nR:+a.nR || 1, nE:+a.nE || 1, ladder:+a.ladder || 2, how,
    reasons: how === 'pick' ? arr(a.reasons).filter(r => r.text) : [], evidences: how !== 'free' && a.ev ? arr(a.evidences).filter(e => e.text) : [],
    qs: how === 'ask' ? arr(a.qs).filter(q => q.q).map(q => ({q:q.q})) : [], qAll: a.qAll !== false};
  if(how === 'pick' && !arg.reasons.length) return toast('고르기 방식이면 근거 목록을 하나 이상 써 주세요');

const MOTION = {};
function walkTo(d, id, x, y){
  const t = performance.now(), m = MOTION[id];

  if(m){ const k = m.dur ? Math.min(1, (t - m.t0) / m.dur) : 1; cx = m.fx + (m.tx - m.fx) * k; cy = m.fy + (m.ty - m.fy) * k; }
  const dist = Math.hypot(x - cx, (y - cy) * .56);
  if(!m || dist < .3){ MOTION[id] = {fx:x, fy:y, tx:x, ty:y, t0:t, dur:0, face}; d.style.left = x + '%'; d.style.top = y + '%'; if(face) d.classList.add('fl'); return; }
  if(Math.abs(x - cx) > .3) face = x < cx;
  const dur = Math.max(350, Math.min(2200, dist * 55));
  MOTION[id] = {fx:cx, fy:cy, tx:x, ty:y, t0:t, dur, face};
  d.style.transition = 'none'; d.style.left = cx + '%'; d.style.top = cy + '%';

}

async function startR2(){
  const pick = (t, n) => teamOf(t).filter(p => p.text).sort((a,b) => (b.likes||0) - (a.likes||0) || a.joinedAt - b.joinedAt).slice(0, n).map(p => p.id);
  if(MODE() === 'multi'){
    const ids = {}; sideKeys().forEach(k => { const a = pick(k, 1); if(a.length) ids[k] = a[0]; });
    if(Object.keys(ids).length < 2) return toast('의견을 쓴 팀이 둘 이상이어야 대결할 수 있어요');
    const order = sideKeys().filter(k => ids[k]);
    return store.updateRoom(ROOM, {phase:'r2', reps:ids, matches:[{multi:true, ids, order, final:true}], mi:0, stage:'ready', si:0, res:{}, rEnd:0});
  }
  const a = pick('A', REPS), b = pick('B', REPS);
  if(!a.length || !b.length) return toast('양쪽에 의견이 있어야 대결할 수 있어요');
  const sa = [...a].sort(() => Math.random() - .5), sb = [...b].sort(() => Math.random() - .5), n = Math.min(sa.length, sb.length);
  const matches = []; for(let i=0;i<n;i++) matches.push({a:sa[i], b:sb[i], final:false});
  if(n === 1) matches[0].final = true;
  await store.updateRoom(ROOM, {phase:'r2', repsA:a, repsB:b, matches, mi:0, stage:'ready', res:{}, rEnd:0});
}
async function reveal(){
  const m = R.matches[R.mi], vs = voteList().filter(v => v.mi === R.mi);
  if(m.multi){
    const counts = {}; m.order.forEach(k => counts[k] = 0); vs.forEach(v => { if(counts[v.pick] != null) counts[v.pick]++; });
    const mx = Math.max(...Object.values(counts)), top = Object.keys(counts).filter(k => counts[k] === mx);
    const winner = top.length === 1 && mx > 0 ? top[0] : 'draw';
    await store.updateRoom(ROOM, {stage:'reveal', ['res.' + R.mi]: {counts, winner}});
    if(winner !== 'draw'){ pop(sideName(winner) + ' 승!'); beep(784,.15); setTimeout(() => beep(1046,.3,'triangle'), 150); }
    return;
  }
  const na = vs.filter(v => v.pick === 'a').length, nb = vs.filter(v => v.pick === 'b').length;
  const winner = na > nb ? 'A' : nb > na ? 'B' : 'draw';
  await store.updateRoom(ROOM, {stage:'reveal', ['res.' + R.mi]: {a:na, b:nb, winner}});
  if(winner !== 'draw'){ pop(sideName(winner) + ' 승!'); beep(784,.15); setTimeout(() => beep(1046,.3,'triangle'), 150); }
}
async function makeFinal(){
  const got = id => voteList().filter(v => { const m = R.matches[v.mi]; return m && !m.final && ((v.pick === 'a' && m.a === id) || (v.pick === 'b' && m.b === id)); }).length;
  const best = ids => [...new Set(ids)].sort((x,y) => got(y) - got(x))[0];
  const a = best(R.matches.map(m => m.a)), b = best(R.matches.map(m => m.b));
  await store.updateRoom(ROOM, {matches: R.matches.concat([{a, b, final:true}]), mi: R.matches.length, stage:'ready', rEnd:0});
}

  const start = {}, sc = {}; players().forEach(p => { if(p.team) start[p.id] = p.team; if(p.score != null) sc[p.id] = p.score; });

    ['answer', '반박이 그 반론에 직접 답한다.', '반론의 핵심을 다시 읽고, 바로 그것에 답해 주세요.'],
    ['reason', '반박에도 이유(왜냐하면 ~)가 있다.', '‘왜냐하면 ~ 때문이다’를 알맞게 채워 주세요.'],
    ['keep', '반박하고 나서도 내 주장이 그대로 유지된다.', '반박이 오히려 상대 주장을 돕고 있지 않은지 살펴보세요.']
  ].map(x => [...x, 'counter']);
}
function openDiag(argOverride){
  const m = me(); if(!m) return;
  const arg = argOverride || m.arg; if(!arg) return openWiz();
  DG = {arg, g:0, ans:{}, no:null};
  drawDiag();
}
function drawDiag(){
  if(!DG) return;
  const m = {...me(), arg:DG.arg}, gs = diagGroups(), g = gs[DG.g], items = diagItems(g, DG.arg);
  let d = $('diag'); if(!d){ d = document.createElement('div'); d.className = 'modal'; d.id = 'diag'; document.body.appendChild(d); }
  const all = items.every(([k]) => DG.ans[g + '.' + k] === 'y');
  d.innerHTML = `<div class="card diagc"><div class="row" style="justify-content:space-between"><b style="font-size:18px">스스로 점검하기</b><span class="tag">${DG.g + 1} / ${gs.length} · ${DG_NAME[g]}</span></div>
    <div class="diag">
      <div class="dleft"><div class="mini muted" style="margin-bottom:6px">내가 쓴 글 — 지금 점검하는 부분이 진하게 보여요</div>${essayHTML(m, g)}</div>
      <div class="dright"><b>${DG_NAME[g]}</b><div class="mini muted">하나씩 읽고 솔직하게 답해 주세요. ‘아니요’면 고치러 갈 수 있어요.</div>
        ${items.map(([k, q, fix]) => { const a = DG.ans[g + '.' + k];
          return `<div class="ck ${a === 'y' ? 'yes' : a === 'n' ? 'no' : ''}"><div>${esc(q)}</div><div class="yn"><button class="btn sm ${a === 'y' ? 'pri' : ''}" data-y="${k}">예</button><button class="btn sm" data-n="${k}">아니요</button></div>
            ${a === 'n' ? `<div class="fix">💡 ${esc(fix)}<br><button class="btn sm pri" data-fix="${k}" style="margin-top:6px">고치러 가기 →</button></div>` : ''}</div>`; }).join('')}
        <div class="row" style="margin-top:10px"><button class="btn sm" id="dLater">나중에 하기</button><div class="grow"></div>
          <button class="btn pri" id="dNext" ${all ? '' : 'disabled'}>${DG.g + 1 < gs.length ? '다음 점검 →' : '점검 끝 — 제출 완료'}</button></div>
        ${all ? '' : '<div class="mini muted" style="margin-top:4px">모든 항목이 ‘예’여야 다음으로 넘어갈 수 있어요.</div>'}
      </div></div></div>`;
  d.querySelectorAll('[data-y]').forEach(b => b.onclick = () => { DG.ans[g + '.' + b.dataset.y] = 'y'; drawDiag(); });
  d.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { DG.ans[g + '.' + b.dataset.n] = 'n'; drawDiag(); });
  d.querySelectorAll('[data-fix]').forEach(b => b.onclick = async () => { const it = items.find(x => x[0] === b.dataset.fix);
    closeDiag(); await store.updatePlayer(ROOM, UID, {diagFix: INC(1)}); openWiz(it ? it[3] : 'reason'); });
  $('dLater').onclick = () => { closeDiag(); toast('[스스로 점검 마치기]를 눌러 언제든 이어서 할 수 있어요'); };
  $('dNext').onclick = async () => {
    if(DG.g + 1 < gs.length){ DG.g++; drawDiag(); return; }
    await store.updatePlayer(ROOM, UID, {diagDone:true, diag:{...DG.ans}});
    closeDiag(); try{ localStorage.removeItem(dKey()); }catch(e){}
    pop('점검 완료!'); toast('제출을 마쳤어요. 친구들이 1라운드에 내 글을 읽게 됩니다.');
  };
}
function closeDiag(){ const d = $('diag'); if(d) d.remove(); DG = null; }

/* ───────── 타이머 ───────── */
let tickT = null;
function tick(){
  clearInterval(tickT);
  const draw = () => { const el = $('timer'); if(!el || !R) return; if(!R.rEnd){ el.textContent = '--:--'; el.classList.remove('low'); return; }
    const s = Math.max(0, Math.round((R.rEnd - now())/1000)); el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); el.classList.toggle('low', s <= 15);
    if(s === 0 && IS_HOST && window.__beeped !== R.rEnd){ window.__beeped = R.rEnd; beep(330,.4,'sawtooth',.05); } };
  draw(); tickT = setInterval(draw, 500);
}

/* ───────── 엑셀(.xlsx) 만들기 — 외부 라이브러리 없이 ───────── */
const CRC = (() => { const t = []; for(let n=0;n<256;n++){ let c = n; for(let k=0;k<8;k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zip(files){
  const enc = new TextEncoder(), parts = [], cd = []; let off = 0;
  const u16 = v => [v & 255, (v >>> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  files.forEach(f => { const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const head = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(head), name, data);
    cd.push(new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off))), name);
    off += head.length + name.length + data.length; });
  let size = 0; cd.forEach(x => { parts.push(x); size += x.length; });
  parts.push(new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(size), u32(off), u16(0))));
  return new Blob(parts, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xesc = s => String(s == null ? '' : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colName = i => { let s = ''; i += 1; while(i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
function makeXlsx(head, rows, widths){
  const all = [head].concat(rows), x = [];
  all.forEach((r, ri) => { x.push(`<row r="${ri+1}">`); r.forEach((v, ci) => { const ref = colName(ci) + (ri+1), sty = ri === 0 ? ' s="1"' : ' s="2"';
    x.push(typeof v === 'number' && isFinite(v) ? `<c r="${ref}"${sty}><v>${v}</v></c>` : `<c r="${ref}"${sty} t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`); }); x.push('</row>'); });
  const cols = '<cols>' + widths.map((w, i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return zip([
    {name:'[Content_Types].xml', data: X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels', data: X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml', data: X + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="토론 기록" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', data: X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml', data: X + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3EAF6"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
    {name:'xl/worksheets/sheet1.xml', data: X + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' + cols + '<sheetData>' + x.join('') + '</sheetData></worksheet>'}
  ]);
}

boot();
