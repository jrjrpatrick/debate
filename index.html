	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;

				for (var i = 0; i < rsBlocks.length; i++) {

					buffer.put(data.mode, 4);

		this.makeImpl(false, this.getBestMaskPattern() );

	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

.timer{font-family:"Gowun Dodum";font-size:44px;font-weight:800;text-align:center;letter-spacing:.02em}
.timer.low{color:var(--bad)}
.guide{background:#F1F3F5;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
.qrbox{display:flex;gap:12px;align-items:center}
.qrbox .code{font-family:"Gowun Dodum";font-size:34px;font-weight:800;letter-spacing:.08em}
#qrSmall{width:92px;height:92px;cursor:pointer}
#qrSmall img,#qrSmall canvas{width:92px!important;height:92px!important}
.feed{max-height:180px;overflow:auto;font-size:13px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(20,22,30,.55);display:grid;place-items:center;z-index:50;padding:14px}
.modal .card{max-width:620px;width:100%;max-height:90vh;overflow:auto}
#qrBig canvas{width:min(70vmin,460px)!important;height:auto!important;margin:0 auto;display:block}

.fighter p{margin:0;font-size:17px;line-height:1.6;white-space:pre-wrap}
.vs{display:grid;place-items:center;font-family:"Gowun Dodum";font-size:34px;font-weight:800}
.votebar{height:14px;border-radius:99px;background:#E9ECEF;overflow:hidden;display:flex;margin-top:10px}
.votebar i{display:block;height:100%}
@media (max-width:700px){.arena{grid-template-columns:1fr}.vs{font-size:22px}}

.stuhead{position:sticky;top:0;z-index:20;background:var(--paper);padding:8px 0 6px}

.myteam{font-weight:800}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.chest{font-size:64px;cursor:pointer;display:inline-block;transition:transform .3s}

table.rec{width:100%;border-collapse:collapse;font-size:13px}

const INC = n => ({__op:'inc', n});
const UNION = (...v) => ({__op:'union', v});
let store;

function makeMock(){
  // 같은 브라우저의 여러 탭이 localStorage로 주고받는다(체험·시험용)
  const K = 'tg_mock_v1';
  const subs = [];
  let MEM = {};
  const load = () => { try{ return JSON.parse(localStorage.getItem(K)) || {}; }catch(e){ return JSON.parse(JSON.stringify(MEM)); } };
  const save = db => { try{ localStorage.setItem(K, JSON.stringify(db)); }catch(e){ MEM = db; } fire(); };
  const fire = () => { const db = load(); subs.forEach(s => s(db)); };
  try{ window.addEventListener('storage', e => { if(e.key === K) fire(); }); }catch(e){}
  const apply = (obj, patch) => {
    for(const [path, val] of Object.entries(patch)){
      const ks = path.split('.'); let o = obj;
      for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]] !== 'object' || !o[ks[i]]) o[ks[i]] = {}; o = o[ks[i]]; }
      const last = ks[ks.length-1];
      if(val && val.__op === 'inc') o[last] = (o[last]||0) + val.n;
      else if(val && val.__op === 'union'){ const a = Array.isArray(o[last]) ? o[last] : []; val.v.forEach(x => { if(!a.includes(x)) a.push(x); }); o[last] = a; }
      else if(val && val.__op === 'del') delete o[last];
      else o[last] = val;
    }
  };
  let uid = null; try{ uid = sessionStorage.getItem('tg_mock_uid'); }catch(e){}
  if(!uid){ uid = 'u' + Math.random().toString(36).slice(2,10); try{ sessionStorage.setItem('tg_mock_uid', uid); }catch(e){} }
  return {
    mock:true,
    async init(){ return uid; },
    async getRoom(c){ return load().rooms?.[c]?.doc || null; },
    async createRoom(c, data){ const db = load(); db.rooms = db.rooms || {}; db.rooms[c] = {doc:data, players:{}, votes:{}}; save(db); },
    async updateRoom(c, patch){ const db = load(); if(!db.rooms?.[c]) return; apply(db.rooms[c].doc, patch); save(db); },
    async deleteRoom(c){ const db = load(); if(db.rooms) delete db.rooms[c]; save(db); },
    async setPlayer(c, id, data){ const db = load(); if(!db.rooms?.[c]) throw new Error('no room'); db.rooms[c].players[id] = data; save(db); },
    async updatePlayer(c, id, patch){ const db = load(); const p = db.rooms?.[c]?.players?.[id]; if(!p) return; apply(p, patch); save(db); },
    async deletePlayer(c, id){ const db = load(); if(db.rooms?.[c]) delete db.rooms[c].players[id]; save(db); },
    async getPlayers(c){ return load().rooms?.[c]?.players || {}; },
    async setVote(c, id, data){ const db = load(); if(!db.rooms?.[c]) return; if(db.rooms[c].votes[id]) throw new Error('voted'); db.rooms[c].votes[id] = data; save(db); },
    watch(c, cb){ const f = db => { const r = db.rooms?.[c]; cb(r ? r.doc : null, r ? r.players : {}, r ? r.votes : {}); }; subs.push(f); f(load()); return () => subs.splice(subs.indexOf(f), 1); }
  };
}

async function makeFirebase(cfg){
  // Firebase 실시간 데이터베이스(Realtime Database) — 바뀐 부분만 오가서 무료 한도 안에서 넉넉함
  const V = '10.12.2';
  const {initializeApp} = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const {getAuth, signInAnonymously, onAuthStateChanged} = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const D = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
  const app = initializeApp(cfg, 'toron-gwangjang');
  const auth = getAuth(app); const db = D.getDatabase(app);
  const conv = patch => { const o = {}; for(const [k,v] of Object.entries(patch)){ const path = k.split('.').join('/');
      if(v && v.__op === 'inc') o[path] = D.increment(v.n);
      else if(v && v.__op === 'union') v.v.forEach(x => o[path + '/' + x] = true);
      else if(v && v.__op === 'del') o[path] = null;
      else o[path] = v === undefined ? null : v; } return o; };
  const norm = p => { if(!p) return p; const q = {...p}; ['liked','read'].forEach(k => { if(q[k] && !Array.isArray(q[k])) q[k] = Object.keys(q[k]); }); return q; };
  const toObj = (arr) => { const o = {}; (arr||[]).forEach(x => o[x] = true); return o; };
  const base = c => `tg/${c}`;
  return {
    mock:false,
    async init(){ await signInAnonymously(auth); return new Promise(res => onAuthStateChanged(auth, u => u && res(u.uid))); },
    async getRoom(c){ const s = await D.get(D.ref(db, base(c) + '/doc')); return s.exists() ? s.val() : null; },
    async createRoom(c, data){ await D.set(D.ref(db, base(c) + '/doc'), data); },
    async updateRoom(c, patch){ await D.update(D.ref(db, base(c) + '/doc'), conv(patch)); },
    async deleteRoom(c){ await D.remove(D.ref(db, base(c))); },
    async setPlayer(c, id, data){ const d = {...data, liked: toObj(data.liked), read: toObj(data.read)}; Object.keys(d).forEach(k => d[k] === undefined && delete d[k]); await D.set(D.ref(db, `${base(c)}/players/${id}`), d); },
    async updatePlayer(c, id, patch){ await D.update(D.ref(db, `${base(c)}/players/${id}`), conv(patch)); },
    async deletePlayer(c, id){ await D.remove(D.ref(db, `${base(c)}/players/${id}`)); },
    async getPlayers(c){ const s = await D.get(D.ref(db, base(c) + '/players')); const o = s.val() || {}; Object.keys(o).forEach(k => o[k] = norm(o[k])); return o; },
    async setVote(c, id, data){ await D.set(D.ref(db, `${base(c)}/votes/${id}`), data); },
    watch(c, cb){
      let room = null, players = {}, votes = {}; const got = {r:0, p:0, v:0};
      const go = () => { if(got.r && got.p && got.v) cb(room, players, votes); };
      const u1 = D.onValue(D.ref(db, base(c) + '/doc'), s => { room = s.val(); got.r = 1; go(); });
      const u2 = D.onValue(D.ref(db, base(c) + '/players'), s => { const o = s.val() || {}; Object.keys(o).forEach(k => o[k] = norm(o[k])); players = o; got.p = 1; go(); });
      const u3 = D.onValue(D.ref(db, base(c) + '/votes'), s => { votes = s.val() || {}; got.v = 1; go(); });
      return () => { u1(); u2(); u3(); };
    }
  };
}

function voteList(){ return Object.values(V || {}); }
function calc(){
  const ps = players(), ind = {}, team = {A:0, B:0}, detail = {A:[], B:[]};
  ps.forEach(p => ind[p.id] = (p.likes||0)*PT.got + (p.liked||[]).length*PT.give + (p.readAll ? PT.readAll : 0));
  ps.forEach(p => { if(p.readAll && p.team && (p.readTeam||p.team)) team[p.readTeam||p.team] += PT.readAllTeam; });
  voteList().forEach(v => { const m = (R.matches||[])[v.mi]; if(!m) return; const target = v.pick === 'a' ? m.a : m.b; const tTeam = v.pick === 'a' ? 'A' : 'B';
    if(ind[target] != null) ind[target] += (v.team === tTeam ? PT.voteSame : PT.voteOpp); });
  Object.entries(R.res || {}).forEach(([mi, r]) => { if(r.winner === 'A' || r.winner === 'B'){ const m = (R.matches||[])[mi]; team[r.winner] += (m && m.final) ? PT.finalWin : PT.win; } });
  const crossed = [];
  if(R.r3start){ ps.forEach(p => { const was = R.r3start[p.id]; if(was && p.team && p.team !== was){ crossed.push(p); ind[p.id] = (ind[p.id]||0) + PT.cross; team[p.team] += PT.crossTeam * (R.key && R.key.team === p.team ? 2 : 1); } }); }
  return {ind, team, crossed};
}

async function reopen(code){ const r = await store.getRoom(code); if(!r) return toast('그 방은 이미 지워졌어요'); if(r.hostUid !== UID) return toast('이 기기에서 연 방이 아니에요'); enter(code, true); }

/* ───────── 교사가 맡는 일: 열쇠 주인, 옮기기 정리, 다시 들어온 학생 정리, 타이머 넘김 ───────── */
let autoT = null;
function hostDuties(prevP){
  const ps = players();
  // 다시 들어온 학생: 옛 문서를 지우고 대진·대표 id를 바꿔 끼운다
  ps.forEach(p => { if(p.replaces && P[p.replaces]){ const old = p.replaces;
      store.deletePlayer(ROOM, old); store.updatePlayer(ROOM, p.id, {replaces:{__op:'del'}});
      const patch = {};
      if((R.matches||[]).some(m => m.a === old || m.b === old)) patch.matches = R.matches.map(m => ({...m, a: m.a === old ? p.id : m.a, b: m.b === old ? p.id : m.b}));
      if(R.r3start && R.r3start[old]) { patch['r3start.' + p.id] = R.r3start[old]; }
      if(Object.keys(patch).length) store.updateRoom(ROOM, patch); } });
  // 황금열쇠 — 먼저 밟은 팀
  if(R.key && !R.key.team){ const g = ps.filter(p => p.gotKey && p.team).sort((a,b) => a.gotKey - b.gotKey)[0];
    if(g){ store.updateRoom(ROOM, {'key.team': g.team, 'key.by': g.id}); feed(`${josa(showName(g),'이','가')} 황금열쇠를 주웠습니다 — ${sideName(g.team)} 팀의 3라운드 이동 점수 2배`); beep(988,.25,'triangle'); } }
  // 옮기기 요청이 반영되면 지운다
  Object.entries(R.moves || {}).forEach(([id, t]) => { if(!P[id] || P[id].team === t) store.updateRoom(ROOM, {['moves.' + id]: {__op:'del'}}); });
  // 소식
  if(prevP){ ps.forEach(p => { const o = prevP[p.id];
      if(!o) { feed(`${josa(showName(p),'이','가')} 들어왔습니다`); beep(880,.06); }
      else { if(!o.text && p.text) feed(`${josa(showName(p),'이','가')} 의견을 올렸습니다`);
        if((p.likes||0) > (o.likes||0)) { feed(`${josa(showName(p),'이','가')} 좋아요를 받았습니다`); beep(1200,.05,'triangle',.05); }
        if(o.team && p.team && o.team !== p.team && R.phase === 'r3'){ feed(`${josa(showName(p),'이','가')} ${sideName(p.team)} 쪽으로 건너갔습니다!`); pop('건너감!'); beep(392,.15,'square',.06); setTimeout(() => beep(784,.25,'triangle'), 150); }
        if(!o.readAll && p.readAll) feed(`${josa(showName(p),'이','가')} 우리 팀 논리를 다 읽었습니다`); } }); }
  // 2라운드 발언 시간이 끝나면 저절로 넘긴다
  clearTimeout(autoT);
  if(R.phase === 'r2' && (R.stage === 'left' || R.stage === 'right') && R.rEnd){
    autoT = setTimeout(() => { if(R.stage === 'left') store.updateRoom(ROOM, {stage:'right', rEnd:now() + DUR.speak*1000}); else if(R.stage === 'right') store.updateRoom(ROOM, {stage:'vote', rEnd:0}); }, Math.max(0, R.rEnd - now()) + 300);
  }
}
const FEED = [];
function feed(t){ FEED.unshift(new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) + '  ' + t); FEED.length = Math.min(FEED.length, 60); const f = $('feed'); if(f) f.innerHTML = FEED.map(esc).join('<br>'); }

function tokInner(o){

// 걷기: 이전 자리에서 새 자리로 걸어간다(다시 그려져도 걷던 곳에서 이어서)
const MOTION = {};
function walkTo(d, id, x, y){
  const t = performance.now(), m = MOTION[id];
  let cx = x, cy = y, face = m ? m.face : false;
  if(m){ const k = m.dur ? Math.min(1, (t - m.t0) / m.dur) : 1; cx = m.fx + (m.tx - m.fx) * k; cy = m.fy + (m.ty - m.fy) * k; }
  const dist = Math.hypot(x - cx, (y - cy) * .56);
  if(!m || dist < .3){ MOTION[id] = {fx:x, fy:y, tx:x, ty:y, t0:t, dur:0, face}; d.style.left = x + '%'; d.style.top = y + '%'; if(face) d.classList.add('fl'); return; }
  if(Math.abs(x - cx) > .3) face = x < cx;
  const dur = Math.max(350, Math.min(2200, dist * 55));
  MOTION[id] = {fx:cx, fy:cy, tx:x, ty:y, t0:t, dur, face};
  d.style.transition = 'none'; d.style.left = cx + '%'; d.style.top = cy + '%';
  d.classList.add('walk'); if(face) d.classList.add('fl');
  requestAnimationFrame(() => requestAnimationFrame(() => { d.style.transition = `left ${dur}ms linear, top ${dur}ms linear`; d.style.left = x + '%'; d.style.top = y + '%'; }));
  setTimeout(() => d.classList.remove('walk'), dur);
}
function drawTokens(board, onTok){

  const ps = players().sort((a,b) => a.y - b.y);
  ps.forEach(p => {
    const d = document.createElement('div');
    const unread = !IS_HOST && R.phase === 'r1' && m && p.id !== UID && p.team === mt && p.text && !(m.read||[]).includes(p.id);
    const isRep = reps.has(p.id) && R.phase === 'r2';
    d.className = `tok ${p.team || 'N'} ${p.id === UID ? 'me' : ''} ${unread ? 'unread' : ''} ${isRep ? 'rep' : ''}`;
    d.style.setProperty('--d', -((hashStr(p.id) % 28) / 10) + 's');
    // 말풍선: 1라운드에는 같은 팀 것만, 교사·결과 화면은 모두
    const showBub = p.text && (IS_HOST || R.phase === 'end' || p.id === UID || (R.phase !== 'write' && p.team === mt) || R.phase === 'r3');
    const txt = (R.phase === 'r3' || R.phase === 'end') && p.r3text ? p.r3text : p.text;
    const label = R.anon && !R.reveal && !(IS_HOST && peek) ? (p.anonNo || '?') : (p.num ? p.num : (showName(p)||'?').slice(-2));
    const hidden = R.anon && !R.reveal && !(IS_HOST && peek);

    d.onclick = e => { e.stopPropagation(); onTok && onTok(p); };
    board.appendChild(d);

  });
}

async function startR2(){
  const pick = t => teamOf(t).filter(p => p.text).sort((a,b) => (b.likes||0) - (a.likes||0) || a.joinedAt - b.joinedAt).slice(0, REPS).map(p => p.id);
  const a = pick('A'), b = pick('B');
  if(!a.length || !b.length) return toast('양쪽 팀에 의견이 있어야 대결할 수 있어요');
  const sa = [...a].sort(() => Math.random() - .5), sb = [...b].sort(() => Math.random() - .5), n = Math.min(sa.length, sb.length);
  const matches = []; for(let i=0;i<n;i++) matches.push({a:sa[i], b:sb[i], final:false});
  if(n === 1) matches[0].final = true;
  await store.updateRoom(ROOM, {phase:'r2', repsA:a, repsB:b, matches, mi:0, stage:'ready', res:{}, rEnd:0});
}
async function reveal(){
  const vs = voteList().filter(v => v.mi === R.mi), na = vs.filter(v => v.pick === 'a').length, nb = vs.filter(v => v.pick === 'b').length;
  const winner = na > nb ? 'A' : nb > na ? 'B' : 'D';
  await store.updateRoom(ROOM, {stage:'reveal', ['res.' + R.mi]: {a:na, b:nb, winner}});
  if(winner !== 'D'){ pop(sideName(winner) + ' 승!'); beep(784,.15); setTimeout(() => beep(1046,.3,'triangle'), 150); }
}
async function makeFinal(){
  const got = id => voteList().filter(v => { const m = R.matches[v.mi]; return m && !m.final && ((v.pick === 'a' && m.a === id) || (v.pick === 'b' && m.b === id)); }).length;
  const best = ids => [...new Set(ids)].sort((x,y) => got(y) - got(x))[0];
  const a = best(R.matches.map(m => m.a)), b = best(R.matches.map(m => m.b));
  await store.updateRoom(ROOM, {matches: R.matches.concat([{a, b, final:true}]), mi: R.matches.length, stage:'ready', rEnd:0});
}
async function startR3(){
  const start = {}; players().forEach(p => { if(p.team) start[p.id] = p.team; });
  await store.updateRoom(ROOM, {phase:'r3', r3start:start, rEnd: now() + DUR.r3*1000, stage:'done'});
}

function recordFor(p){
  const clean = s => String(s||'').replace(/[.。]+\s*$/,'').replace(/\s+/g,' ').trim();
  const out = [];
  const t = clean(R.topic).replace(/\?$/, '');

  out.push(`‘${t}’를 두고 벌인 토론 활동에서 ‘${sideName(startTeam || p.team)}’ 입장에 섬.`);
  if(p.text) out.push(`‘${clean(p.text).slice(0,50)}’라는 근거를 들어 자신의 입장을 밝힘.`);
  if((p.likes||0) >= 2) out.push(`또래 평가에서 좋아요 ${p.likes}개를 받아 근거의 설득력을 인정받음.`);
  const reps = [...(R.repsA||[]), ...(R.repsB||[])];
  if(reps.includes(p.id)) out.push('팀원들의 지지로 대표에 뽑혀 상대 팀과의 토론 대결에 나섬.');
  const opp = voteList().filter(v => { const m = (R.matches||[])[v.mi]; if(!m) return false; const tgt = v.pick === 'a' ? m.a : m.b, tt = v.pick === 'a' ? 'A' : 'B'; return tgt === p.id && v.team !== tt; }).length;
  if(opp) out.push(`토론 뒤 투표에서 자신과 다른 입장에 선 학생 ${opp}명에게서도 표를 얻음.`);
  const fin = (R.matches||[]).findIndex(m => m.final); const fr = (R.res||{})[fin];
  if(fin >= 0 && fr){ const fm = R.matches[fin]; if((fr.winner === 'A' && fm.a === p.id) || (fr.winner === 'B' && fm.b === p.id)) out.push('결승 대결에서 이겨 이날 토론의 최종 승자가 됨.'); }
  if(p.readAll) out.push('같은 팀 학생들의 글을 빠짐없이 읽고 평가에 참여함.');
  if(startTeam && p.team && startTeam !== p.team && p.r3why) out.push(`상대 팀의 근거를 검토한 뒤 ‘${clean(p.r3why).slice(0,40)}’라는 이유로 자신의 입장을 수정함.`);
  return out.join(' ');
}

  if(R.phase === 'r3'){ const was = R.r3start && R.r3start[UID]; if(was && m.team && was !== m.team) add(m.r3why ? '건너간 이유 고치기' : '건너간 이유 쓰기', r3Modal); }
  const board = $('board');
  if(board){
    drawTokens(board, p => onTokStu(p, m));
    board.onclick = e => moveMe(e, board, m);
  }
  if(R.phase === 'r2' && tm) voteUI(tm, m);
  if(R.phase === 'end') bindResult(false);
  tick();
}
function myCard(m){ const {ind} = calc(); const ps = players().sort((a,b) => (ind[b.id]||0) - (ind[a.id]||0)); const rank = ps.findIndex(p => p.id === UID) + 1;
  return `<div class="card" style="margin-top:12px"><b>나의 기록</b> <span class="muted">(나만 보여요)</span><div class="mini" style="margin-top:6px">${ps.length}명 중 ${rank}등 · 받은 좋아요 ${m.likes||0}개 · 점수 ${ind[UID]||0}</div>
    <p class="mini">내가 쓴 것 — ${esc(m.text||'')}</p>${m.r3text ? `<p class="mini">건너가서 새로 쓴 것 — ${esc(m.r3text)}</p><p class="mini">바뀐 이유 — ${esc(m.r3why)}</p>` : ''}</div>`; }
async function moveMe(e, board, m){
  if(R.phase === 'r2' || R.phase === 'end') return;
  const r = board.getBoundingClientRect(); let x = Math.round((e.clientX - r.left) / r.width * 100), y = Math.round((e.clientY - r.top) / r.height * 100);
  y = Math.max(28, Math.min(96, y)); x = Math.max(3, Math.min(97, x));
  const locked = R.split !== 'pick' && (R.phase === 'write' || R.phase === 'r1');
  const lockedPick = R.split === 'pick' && R.phase === 'r1';
  if((locked || lockedPick) && m.team){ if(m.team === 'A') x = Math.min(x, 46); else x = Math.max(x, 54); }
  const patch = {x, y};
  if(R.phase === 'r3' || (R.split === 'pick' && R.phase === 'write')){ const t = x < 50 ? 'A' : 'B'; if(t !== m.team){ patch.team = t; if(R.phase === 'r3'){ const was = R.r3start && R.r3start[UID]; toast(was === t ? '원래 팀으로 돌아왔어요' : '건너왔어요 — 바뀐 입장과 이유를 써 주세요'); if(was !== t) setTimeout(r3Modal, 700); } } }
  if(R.key && !R.key.team && !m.gotKey && Math.hypot(x - R.key.x, (y - R.key.y) * .56) < 6 && R.phase !== 'r3'){ patch.gotKey = now(); toast('🗝️ 황금열쇠를 주웠어요! 우리 팀의 3라운드 이동 점수가 두 배'); }
  await store.updatePlayer(ROOM, UID, patch);
}
function onTokStu(p, m){
  if(p.id === UID) return writeModal();
  if(R.phase === 'write'){ if(p.team === m.team && p.text) return toast('1라운드가 시작되면 읽을 수 있어요'); return toast(p.team === m.team ? '아직 의견을 쓰지 않았어요' : '상대 팀 논리는 2라운드에 공개'); }
  if(R.phase === 'r1'){
    if(p.team !== m.team) return toast('상대 팀 — 2라운드에 공개');
    if(!p.text) return toast('아직 의견을 쓰지 않았어요');
    markRead(p, m);
    const already = (m.liked||[]).includes(p.id), left = LIKES - (m.liked||[]).length;
    return readModal(p, [[already ? '좋아요 완료' : `좋아요 주기 (${left}개 남음)`, () => like(p, m), 'pri', already || left <= 0]]);
  }
  readModal(p);
}
async function markRead(p, m){
  if((m.read||[]).includes(p.id)) return;
  const read = new Set([...(m.read||[]), p.id]);
  const mates = teamOf(m.team).filter(x => x.id !== UID && x.text).map(x => x.id);
  const all = mates.length > 0 && mates.every(id => read.has(id));
  const patch = {read: UNION(p.id)}; if(all && !m.readAll){ patch.readAll = true; patch.readTeam = m.team; setTimeout(() => toast('우리 팀 논리를 다 읽었어요! 보너스 +' + PT.readAll), 400); }
  await store.updatePlayer(ROOM, UID, patch);
}
async function like(p, m){
  if((m.liked||[]).includes(p.id)) return toast('이미 좋아요를 눌렀어요');
  if((m.liked||[]).length >= LIKES) return toast('좋아요를 다 썼어요');
  await store.updatePlayer(ROOM, UID, {liked: UNION(p.id)});
  await store.updatePlayer(ROOM, p.id, {likes: INC(1)});
  toast(`좋아요 — 나 +${PT.give} · 상대 +${PT.got} (남은 ${LIKES - (m.liked||[]).length - 1}개)`);
}
function writeModal(){
  const m = me(); if(!m) return;
  if(R.phase !== 'write' && R.phase !== 'r1') return readModal(m);
  if(!m.team) return toast('먼저 바닥을 눌러 설 자리를 고르세요');
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="card"><span class="tag" style="background:${m.team==='A'?'var(--A2)':'var(--B2)'}">${esc(sideName(m.team))}</span>
    <h3 style="margin:8px 0">내 의견 · 또는 내가 던지는 질문</h3><p class="muted mini" style="margin:0">논제: ${esc(R.topic)}</p>
    <textarea class="t" id="wTxt" maxlength="200" placeholder="나는 ~라고 생각한다. 왜냐하면 ~ 때문이다.">${esc(m.text||'')}</textarea>
    <div class="mini muted">지금 서 있는 쪽 팀의 의견으로 저장됩니다. 언제든 고칠 수 있어요.</div>
    <div class="row" style="margin-top:10px"><div class="grow"></div><button class="btn" id="wX">닫기</button><button class="btn pri" id="wOk">저장</button></div></div>`;
  document.body.appendChild(d); $('wTxt').focus();
  $('wX').onclick = () => d.remove();
  $('wOk').onclick = async () => { const t = $('wTxt').value.trim(); if(t.length < 5) return toast('이유나 질문을 조금 더 써 주세요'); await store.updatePlayer(ROOM, UID, {text:t}); d.remove(); toast('저장했어요 — 언제든 고칠 수 있어요'); };
}
function r3Modal(){
  const m = me(); if(!m || $('r3m')) return;
  const d = document.createElement('div'); d.className = 'modal'; d.id = 'r3m';
  d.innerHTML = `<div class="card"><span class="tag" style="background:${m.team==='A'?'var(--A2)':'var(--B2)'}">${esc(sideName(m.team))} 쪽으로 건너옴</span>
    <label class="f">바뀐 내 입장 — 새로 쓰기</label><textarea class="t" id="r3t" maxlength="160">${esc(m.r3text||'')}</textarea>
    <label class="f">왜 마음이 바뀌었나요? (누구의 어떤 근거 때문인지)</label><textarea class="t" id="r3w" maxlength="160">${esc(m.r3why||'')}</textarea>
    <div class="mini muted">왜 바뀌었는지까지 써야 저장됩니다 — 오늘 활동에서 가장 중요한 기록입니다.</div>
    <div class="row" style="margin-top:10px"><div class="grow"></div><button class="btn" id="r3x">닫기</button><button class="btn pri" id="r3ok">저장</button></div></div>`;
  document.body.appendChild(d);
  $('r3x').onclick = () => d.remove();
  $('r3ok').onclick = async () => { const t = $('r3t').value.trim(), w = $('r3w').value.trim(); if(!t) return toast('바뀐 입장을 써 주세요'); if(!w) return toast('왜 마음이 바뀌었는지도 한 줄 써 주세요');
    await store.updatePlayer(ROOM, UID, {r3text:t, r3why:w}); d.remove(); toast('바뀐 입장을 남겼어요'); };
}
function voteUI(tm, m){
  const area = $('voteArea'); if(!area) return;
  const vid = R.mi + '_' + UID, mine = V[vid];
  if(R.stage !== 'vote'){ area.innerHTML = ''; return; }
  if(tm.a === UID || tm.b === UID){ area.innerHTML = '<p class="muted" style="text-align:center">나는 선수라 투표할 수 없어요.</p>'; return; }
  if(mine){ area.innerHTML = '<p style="text-align:center"><b>투표 완료</b> — 누가 어디에 넣었는지는 아무도 볼 수 없습니다.</p>'; return; }
  area.innerHTML = `<div class="row" style="margin-top:12px"><button class="btn A grow" id="vA">${esc(sideName('A'))} 쪽이 더 설득력 있다</button><button class="btn B grow" id="vB">${esc(sideName('B'))} 쪽이 더 설득력 있다</button></div>`;
  const cast = async pick => { try{ await store.setVote(ROOM, vid, {mi:R.mi, pick, team:m.team || null, at:now()}); toast('넣었어요 — 익명입니다'); }catch(e){ toast('이미 넣었어요'); } };
  $('vA').onclick = () => cast('a'); $('vB').onclick = () => cast('b');
}

/* ───────── 타이머 ───────── */
let tickT = null;
function tick(){
  clearInterval(tickT);
  const draw = () => { const el = $('timer'); if(!el || !R) return; if(!R.rEnd){ el.textContent = '--:--'; el.classList.remove('low'); return; }
    const s = Math.max(0, Math.round((R.rEnd - now())/1000)); el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); el.classList.toggle('low', s <= 15);
    if(s === 0 && IS_HOST && window.__beeped !== R.rEnd){ window.__beeped = R.rEnd; beep(330,.4,'sawtooth',.05); } };
  draw(); tickT = setInterval(draw, 500);
}

/* ───────── 엑셀(.xlsx) 만들기 — 외부 라이브러리 없이 ───────── */
const CRC = (() => { const t = []; for(let n=0;n<256;n++){ let c = n; for(let k=0;k<8;k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zip(files){
  const enc = new TextEncoder(), parts = [], cd = []; let off = 0;
  const u16 = v => [v & 255, (v >>> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  files.forEach(f => { const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const head = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(head), name, data);
    cd.push(new Uint8Array([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off))), name);
    off += head.length + name.length + data.length; });
  let size = 0; cd.forEach(x => { parts.push(x); size += x.length; });
  parts.push(new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(size), u32(off), u16(0))));
  return new Blob(parts, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xesc = s => String(s == null ? '' : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colName = i => { let s = ''; i += 1; while(i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
function makeXlsx(head, rows, widths){
  const all = [head].concat(rows), x = [];
  all.forEach((r, ri) => { x.push(`<row r="${ri+1}">`); r.forEach((v, ci) => { const ref = colName(ci) + (ri+1), sty = ri === 0 ? ' s="1"' : ' s="2"';
    x.push(typeof v === 'number' && isFinite(v) ? `<c r="${ref}"${sty}><v>${v}</v></c>` : `<c r="${ref}"${sty} t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`); }); x.push('</row>'); });
  const cols = '<cols>' + widths.map((w, i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') + '</cols>';
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return zip([
    {name:'[Content_Types].xml', data: X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels', data: X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml', data: X + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="토론 기록" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', data: X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml', data: X + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE3EAF6"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
    {name:'xl/worksheets/sheet1.xml', data: X + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' + cols + '<sheetData>' + x.join('') + '</sheetData></worksheet>'}
  ]);
}

boot();
